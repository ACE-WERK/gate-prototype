<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gate · Prototype</title>
  <meta name="description" content="Gate stablecoin checkout prototype — one hold workflow seen from payer, merchant and compliance seats.">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Demo bar (not product UI) -->
  <header id="demo-bar" class="demo-bar" aria-label="Demo controls"></header>

  <!-- Product app shell -->
  <div class="app-shell">
    <nav class="app-nav" aria-label="Gate navigation">
      <span class="brand">Gate <span class="brand-tag">Prototype</span></span>
      <span class="proto-label" id="proto-label">Prototype · illustrative data</span>
    </nav>
    <main id="screen" class="screen" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="false"></div>

  <!-- Classic deferred scripts, ordered by dependency (R5). No modules, no fetch. -->
  <script src="js/strings.js"></script>
  <script src="js/fixtures.js"></script>
  <script src="js/statuses.js"></script>
  <!-- Phase 2: the store re-derives payment status from transactions. -->
  <script src="js/derive.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/screens/payer-checkout.js"></script>
  <script src="js/screens/payer-status.js"></script>
  <script src="js/screens/merchant-payments.js"></script>
  <script src="js/screens/merchant-payment-detail.js"></script>
  <script src="js/screens/compliance-case.js"></script>
  <script src="js/demo-bar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
